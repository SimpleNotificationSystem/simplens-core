services:
  api:
    image: ghcr.io/simplenotificationsystem/simplens-core:latest
    container_name: api
    ports:
      - 3000:3000
    env_file:
      - .env
    volumes:
      - plugin-data:/app/.plugins
      - logs-data:/app/logs
      - ./simplens.config.yaml:/app/simplens.config.yaml:ro
    command: [ "node", "dist/api/server.js" ]
    networks:
      - simplens
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    image: ghcr.io/simplenotificationsystem/simplens-core:latest
    env_file:
      - .env
    volumes:
      - logs-data:/app/logs
    command: [ "node", "dist/workers/worker.js" ]
    networks:
      - simplens
    restart: unless-stopped

  notification_processor:
    image: ghcr.io/simplenotificationsystem/simplens-core:latest
    env_file:
      - .env
    volumes:
      - plugin-data:/app/.plugins
      - logs-data:/app/logs
      - ./simplens.config.yaml:/app/simplens.config.yaml:ro
    command: [ "node", "dist/processors/unified/unified.processor.js" ]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - simplens
    restart: unless-stopped

  delayed_processor:
    image: ghcr.io/simplenotificationsystem/simplens-core:latest
    env_file:
      - .env
    volumes:
      - logs-data:/app/logs
    command: [ "node", "dist/processors/delayed/delayed.processor.js" ]
    networks:
      - simplens
    restart: unless-stopped

  recovery:
    image: ghcr.io/simplenotificationsystem/simplens-core:latest
    env_file:
      - .env
    volumes:
      - logs-data:/app/logs
    command: [ "node", "dist/workers/recovery/recovery.service.js" ]
    networks:
      - simplens
    restart: unless-stopped

  dashboard:
    image: ghcr.io/simplenotificationsystem/simplens-dashboard:latest
    ports:
      - 3002:3002
    container_name: dashboard
    env_file:
      - .env
    environment:
      PORT: ${DASHBOARD_PORT:-3002}
      API_BASE_URL: http://api:${PORT:-3000}
      WEBHOOK_HOST: dashboard
      WEBHOOK_PORT: ${DASHBOARD_PORT:-3002}
    networks:
      - simplens
    restart: unless-stopped

volumes:
  plugin-data:
  logs-data:

networks:
  simplens:
    driver: bridge
