# ==============================================================================
# SimpleNS Local Environment (Built from Local Source Code)
# Connects to shared 'simplens-infra' network and 'simplens_local' database.
# ==============================================================================

name: simplens-local

services:
  # ============================================
  # 1. API Server
  # ============================================
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: simplens-core:local
    container_name: simplens-api-local
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      MONGO_URI: mongodb://mongo:27017/simplens_local?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      BROKERS: kafka:9093
      LOKI_URL: http://loki:3100
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SIMPLENS_CONFIG_PATH: ${SIMPLENS_CONFIG_PATH:-/app/simplens.config.yaml}
    volumes:
      - logs-data-local:/app/logs
      # - ../simplens.config.yaml:/app/simplens.config.yaml:ro
    command: [ "node", "dist/api/server.js" ]
    networks:
      - simplens-infra
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      simplens.environment: "local"

  # ============================================
  # 2. Outbox Worker
  # ============================================
  worker:
    image: simplens-core:local
    container_name: simplens-worker-local
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_URI: mongodb://mongo:27017/simplens_local?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      BROKERS: kafka:9093
      LOKI_URL: http://loki:3100
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - logs-data-local:/app/logs
    command: [ "node", "dist/workers/worker.js" ]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - simplens-infra
    restart: unless-stopped
    labels:
      simplens.environment: "local"

  # ============================================
  # 3. Unified Notification Processor
  # ============================================
  notification_processor:
    image: simplens-core:local
    container_name: simplens-notification-processor-local
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_URI: mongodb://mongo:27017/simplens_local?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      BROKERS: kafka:9093
      PROCESSOR_CHANNEL: ${PROCESSOR_CHANNEL:-all}
      SIMPLENS_CONFIG_PATH: ${SIMPLENS_CONFIG_PATH:-/app/simplens.config.yaml}
      LOKI_URL: http://loki:3100
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - logs-data-local:/app/logs
      # - ../simplens.config.yaml:/app/simplens.config.yaml:ro
    command: [ "node", "dist/processors/unified/unified.processor.js" ]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - simplens-infra
    restart: unless-stopped
    labels:
      simplens.environment: "local"

  # ============================================
  # 4. Delayed Processor (Scheduled Notifications)
  # ============================================
  delayed_processor:
    image: simplens-core:local
    container_name: simplens-delayed-processor-local
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_URI: mongodb://mongo:27017/simplens_local?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      BROKERS: kafka:9093
      LOKI_URL: http://loki:3100
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - logs-data-local:/app/logs
    command: [ "node", "dist/processors/delayed/delayed.processor.js" ]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - simplens-infra
    restart: unless-stopped
    labels:
      simplens.environment: "local"

  # ============================================
  # 5. Recovery Service (Stuck Notifications & Audits)
  # ============================================
  recovery:
    image: simplens-core:local
    container_name: simplens-recovery-local
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_URI: mongodb://mongo:27017/simplens_local?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      LOKI_URL: http://loki:3100
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - logs-data-local:/app/logs
    command: [ "node", "dist/workers/recovery/recovery.service.js" ]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - simplens-infra
    restart: unless-stopped
    labels:
      simplens.environment: "local"

  # ============================================
  # 6. Admin Dashboard (Next.js)
  # ============================================
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    image: simplens-dashboard:local
    container_name: simplens-dashboard-local
    ports:
      - "3002:3002"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: ${DASHBOARD_PORT:-3002}
      API_BASE_URL: http://api:${PORT:-3000}
      MONGO_URI: mongodb://mongo:27017/simplens_local?replicaSet=rs0
      AUTH_SECRET: ${AUTH_SECRET:-change-this-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      AUTH_TRUST_HOST: "true"
      WEBHOOK_HOST: dashboard
      WEBHOOK_PORT: "3002"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - simplens-infra
    restart: unless-stopped
    labels:
      simplens.environment: "local"

volumes:
  logs-data-local:

networks:
  simplens-infra:
    external: true
    name: simplens-infra
