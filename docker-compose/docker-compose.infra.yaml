# ==============================================================================
# SimpleNS Shared Infrastructure Services
# Runs Mongo (Replica Set), Kafka (KRaft), Kafka-UI, Redis, Loki, Grafana
# Shared across all application environments (local, dev, master).
# ==============================================================================

name: infra

services:
  # ============================================
  # 1. MongoDB (Replica Set rs0 for Transactions)
  # ============================================
  mongo:
    image: mongo:7.0
    container_name: simplens-infra-mongo
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    ports:
      - "27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'${INFRA_HOST:-host.docker.internal}:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - simplens-infra
    restart: unless-stopped

  # ============================================
  # 2. Apache Kafka (KRaft Native Mode)
  # ============================================
  kafka:
    image: apache/kafka-native
    container_name: simplens-infra-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://${INFRA_HOST:-host.docker.internal}:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - simplens-infra
    restart: unless-stopped

  # ============================================
  # 3. Kafka UI (Topic & Consumer Explorer)
  # ============================================
  kafka-ui:
    image: kafbat/kafka-ui:main
    container_name: simplens-infra-kafka-ui
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka
    networks:
      - simplens-infra
    restart: unless-stopped

  # ============================================
  # 4. Redis (Idempotency, Queue, Pub/Sub)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: simplens-infra-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - simplens-infra
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================
  # 5. Observability (Loki & Grafana)
  # ============================================
  loki:
    image: grafana/loki:2.9.0
    container_name: simplens-infra-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - simplens-infra
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: simplens-infra-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - simplens-infra
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_config:
  kafka_data:
  redis_data:
  loki_data:
  grafana_data:

networks:
  simplens-infra:
    name: simplens-infra
    driver: bridge
