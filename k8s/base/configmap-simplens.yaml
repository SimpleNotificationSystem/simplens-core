apiVersion: v1
kind: ConfigMap
metadata:
  name: simplens-config
  namespace: simplens
data:
  simplens.config.yaml: |
    # ============================================
    # SimpleNS Configuration
    # ============================================
    providers:
      # mock - @simplens/mock
      - package: "@simplens/mock"
        id: mock
        credentials:
          {} # No credentials required
        options:
          priority: 1  # Higher = preferred
          rateLimit:
            maxTokens: 100  # Token bucket capacity
            refillRate: 10  # Tokens per interval
            refillInterval: second  # Options: second, minute, hour, day

      # mock-fb - @simplens/mock
      - package: "@simplens/mock"
        id: mock-fb
        credentials:
          {} # No credentials required
        options:
          priority: 1  # Higher = preferred
          rateLimit:
            maxTokens: 100  # Token bucket capacity
            refillRate: 10  # Tokens per interval
            refillInterval: second  # Options: second, minute, hour, day

      # nodemailer-gmail - @simplens/nodemailer-gmail
      - package: "@simplens/nodemailer-gmail"
        id: nodemailer-gmail
        credentials:
          EMAIL_USER: ${EMAIL_USER}
          EMAIL_PASS: ${EMAIL_PASS}
        optionalConfig:
          EMAIL_HOST: ${EMAIL_HOST}
          EMAIL_PORT: ${EMAIL_PORT}
          EMAIL_FROM: ${EMAIL_FROM}
        options:
          priority: 1
          rateLimit:
            maxTokens: 100
            refillRate: 10
            refillInterval: second

    channels:
      mock:
        default: mock
        fallback: mock-fb
      email:
        default: nodemailer-gmail
