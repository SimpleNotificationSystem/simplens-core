# ==============================================================================
# Internal ClusterIP Services for Intra-Cluster Communication
# Allows all App Pods to reach MongoDB, Kafka, Redis, and Loki by name
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: simplens
  labels:
    app.kubernetes.io/name: mongo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: simplens-infra
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
      nodePort: 30717
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: simplens
  labels:
    app.kubernetes.io/name: kafka
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: simplens-infra
  ports:
    - name: internal
      port: 9093
      targetPort: 9093
    - name: host
      port: 9092
      targetPort: 9092
      nodePort: 30092
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: simplens
  labels:
    app.kubernetes.io/name: redis
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: simplens-infra
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      nodePort: 30379
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: simplens
  labels:
    app.kubernetes.io/name: loki
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: simplens-infra
  ports:
    - name: http-loki
      port: 3100
      targetPort: 3100
---
# ==============================================================================
# Host-Facing NodePort Services for Web Dashboards
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: simplens
  labels:
    app.kubernetes.io/name: kafka-ui
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: simplens-infra
  ports:
    - name: http-kafkaui
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: simplens
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: simplens-infra
  ports:
    - name: http-grafana
      port: 3000
      targetPort: 3000
      nodePort: 30001
