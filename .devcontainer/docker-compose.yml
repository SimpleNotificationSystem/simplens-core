# Dev Container Docker Compose
# Provides development environment with all infrastructure services

services:
  # ============================================
  # Development Container (where you code)
  # ============================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount source code - changes appear instantly
      - ..:/workspaces/simplens-core:cached
      # Persist node_modules in a named volume (faster than mounting)
      - node_modules:/workspaces/simplens-core/node_modules
      # Persist VS Code extensions
      - vscode-extensions:/home/node/.vscode-server/extensions
    # Keep container running
    command: sleep infinity
    # Network for service communication
    networks:
      - ns-dev-network
    # Environment variables from .env file
    env_file:
      - ../.env
    environment:
      # Override for development
      NODE_ENV: development
      # Connection strings for containerized services
      MONGO_URI: mongodb://mongo:27017/notification_service?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      BROKERS: kafka:9093
      LOKI_URL: http://loki:3100
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  # ============================================
  # Infrastructure Services
  # ============================================
  mongo:
    image: mongo:7.0
    container_name: devcontainer-mongo
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    ports:
      - 27017:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - ns-dev-network

  redis:
    image: redis:7-alpine
    container_name: devcontainer-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ns-dev-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka-native
    container_name: devcontainer-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ns-dev-network

  kafka-ui:
    image: kafbat/kafka-ui:main
    container_name: devcontainer-kafka-ui
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka
    networks:
      - ns-dev-network

  # ============================================
  # Observability Services
  # ============================================
  loki:
    image: grafana/loki:2.9.0
    container_name: devcontainer-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - ns-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.0
    container_name: devcontainer-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - ns-dev-network

volumes:
  node_modules:
  vscode-extensions:
  mongo_data:
  mongo_config:
  redis_data:
  kafka_data:
  loki_data:
  grafana_data:


networks:
  ns-dev-network:
    driver: bridge
