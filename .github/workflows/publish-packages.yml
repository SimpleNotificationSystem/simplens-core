name: NPM Packages CI/CD

on:
  push:
    branches:
      - main
      - master
      - development
      - develop
    paths:
      - 'packages/**'
  pull_request:
    branches:
      - main
      - master
      - development
      - develop
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed package paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            config-gen: 'packages/config-gen/**'
            create-simplens-plugin: 'packages/create-simplens-plugin/**'
            mcp-server: 'packages/mcp-server/**'
            onboard: 'packages/onboard/**'
            sdk: 'packages/sdk/**'

  build-and-test:
    needs: detect-packages
    if: needs.detect-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install package dependencies
        working-directory: packages/${{ matrix.package }}
        run: npm install

      - name: Build package
        working-directory: packages/${{ matrix.package }}
        run: npm run build --if-present

      - name: Run package tests (if present)
        working-directory: packages/${{ matrix.package }}
        run: npm test --if-present
        env:
          CI: true

  publish:
    needs: [detect-packages, build-and-test]
    if: |
      needs.detect-packages.outputs.packages != '[]' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-packages.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check package version on NPM
        id: check
        working-directory: packages/${{ matrix.package }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_version=$PKG_VERSION" >> $GITHUB_OUTPUT

          if npm view "$PKG_NAME@$PKG_VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Version $PKG_VERSION of $PKG_NAME is ALREADY published on NPM. Skipping publish."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "🚀 Version $PKG_VERSION of $PKG_NAME is NEW! Proceeding to publish."
          fi

      - name: Install package dependencies
        if: steps.check.outputs.published == 'false'
        working-directory: packages/${{ matrix.package }}
        run: npm install

      - name: Build package
        if: steps.check.outputs.published == 'false'
        working-directory: packages/${{ matrix.package }}
        run: npm run build --if-present

      - name: Publish package to NPM
        if: steps.check.outputs.published == 'false'
        working-directory: packages/${{ matrix.package }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
